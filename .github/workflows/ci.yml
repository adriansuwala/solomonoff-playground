# Continuous integration for the arXiv:2609.30063 explainer.
#
# WHY THE PINS BELOW ARE LOAD-BEARING -- read before "upgrading" either one.
#
# `public/data/*.json` is a COMMITTED build product (see .gitignore and
# .gitattributes). The `data` job proves it still comes out of the committed
# builder. That proof depends on the numeric stack for two separate reasons,
# and the second one cost us a red build:
#
# 1. SCIPY VERSION. The power-law fits in public/data/scaling.json come from the
#    authors' vendored scipy.optimize curve_fit / minimize. Those optimizers
#    stop at a tolerance, not at the exact optimum, so the trailing bits of
#    `amplitude` and `exponent` depend on the LAPACK/BLAS build behind the
#    scipy wheel. MEASURED: with numpy==2.4.6 pinned, scipy 1.15.3 / 1.16.3 /
#    1.17.0 each reproduce the committed bundle byte-for-byte, while scipy
#    1.18.1 moves 116 leaves by up to ~1.4e27 on values around 1e21 -- a
#    relative delta of ~1.4e-6, which straddles the comparison tolerance below.
#    So the scipy pin is not cosmetic; a bump makes this job flaky at best.
#
# 2. FIT CONVERGENCE -- the real cause of the first failure. `curve_fit` was
#    called with SciPy's default ftol=xtol=gtol=1e-8, which stops the optimiser
#    when the cost stops *moving* rather than at the optimum. The fitted
#    parameters were therefore partly a property of the machine: measured, the
#    shipped fit sat ~5e-5 (relative) from the true optimum while being stored
#    to 17 significant digits. `tools/build_data.py` now converges it
#    (FIT_TOLERANCES = 1e-14). See docs/decisions.md D7.
#
#    Under-convergence made the build machine-dependent. SciPy's
#    manylinux wheels bundle OpenBLAS, which picks a kernel at RUNTIME from the
#    CPU feature set, so the arithmetic path differs between the generation
#    machine (Sapphire Rapids Xeon, AVX-512) and the ubuntu-24.04 runner.
#    The inputs were always bit-identical across hosts (compute is integral,
#    losses are CSV-parsed), so only the solver's internals ever varied.
#
#    CONVERGENCE WAS NECESSARY BUT NOT SUFFICIENT -- see D8. Measured on a real
#    runner, the fit fields still move by up to 1.8e-5 across CPUs even fully
#    converged, because the stored `amplitude` is A at compute = 1, some 31
#    orders of magnitude below anything measured, so it scales as
#    1e15**alpha and multiplies the exponent's ~1e-7 residual error by ~34.
#    That is ill-conditioning, not under-convergence: tightening the optimiser
#    further does not move it. So the fit fields get their own 1e-3 tolerance
#    and everything measured keeps 1e-6.
#
# So the job does NOT demand byte equality. tools/diff_bundle.py compares the
# rebuilt bundle to the committed one field by field and requires what is
# actually portable: identical key sets, identical array lengths, and EXACTLY
# equal strings and labels; only numeric leaves get a relative tolerance, and
# that tolerance is split -- 1e-6 for the 784,200 measured values, 1e-3 for the
# 520 power-law fit scalars an optimiser produced. tools/test_diff_bundle.py
# runs in this job to prove the loosened gate still rejects a fit that is
# genuinely wrong, since a tolerance wide enough to accept anything would be
# indistinguishable from no check at all. It prints the worst delta on every
# run so the margin stays visible instead of becoming a mystery.
#
# It also caps its own output. The bundle is written as single-line JSON --
# scaling.json is ~6.2 MB on ONE line -- so a plain `git diff` turns a single
# changed byte into a multi-megabyte log line, which is what made the first
# failure unreadable. diff_bundle.py prints at most 12 findings as short
# path/value lines instead.
#
# Node is pinned to 24 (LTS) so the build cannot drift because a runner image
# moved.
#
# HONEST STATUS: both jobs have now been through a real runner. The first data
# job run failed, on point 2 above, exactly as this header warned: converging
# the fit was necessary but did not make the result machine-independent. D8
# measured why and split the tolerance rather than loosening it globally; see
# "TWO TOLERANCES" in tools/diff_bundle.py. The gate now also proves it can still
# fail, via tools/test_diff_bundle.py in the same job.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Superseded PR runs are cancelled: a new push to the same ref makes every
# in-flight run for that ref redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Typecheck, test, lint, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  data:
    name: Verify data bundle and its reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Not required for correctness -- diff_bundle.py is tolerance-based on
      # purpose -- but single-threaded BLAS removes one more source of run-to-
      # run variation and costs nothing here.
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned exactly: no ranges, no constraints file. See the header --
      # these pins are load-bearing, and the compare step below is the check
      # that they are right.
      - name: Install numeric stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.4.6" "scipy==1.17.0"

      - name: Show resolved numeric stack
        run: python -c "import numpy, scipy, sys; print(sys.version.split()[0], '| numpy', numpy.__version__, '| scipy', scipy.__version__)"

      - name: Verify committed bundle (165 assertions)
        run: python tools/verify_data.py

      - name: Rebuild bundle
        run: python tools/build_data.py

      # The committed bundle must still come out of the committed builder: no
      # structural change, no changed string or label, no numeric drift beyond
      # 1e-6 relative. Replaces `git diff --exit-code`, which was unusable on
      # a single-line 6 MB JSON file -- see the header.
      # The gate above is only worth having if it can still fail. This asserts
      # that, by feeding it corrupted bundles and requiring a rejection -- a
      # tolerance loosened far enough to accept anything would otherwise be
      # indistinguishable from a working check.
      - name: Prove the bundle gate still rejects real defects
        run: python tools/test_diff_bundle.py

      - name: Compare rebuilt bundle against the committed one
        run: python tools/diff_bundle.py
