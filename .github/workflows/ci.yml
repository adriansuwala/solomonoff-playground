# Continuous integration for the arXiv:2609.30063 explainer.
#
# WHY THE PINS BELOW ARE LOAD-BEARING -- read before "upgrading" either one.
#
# `public/data/*.json` is a COMMITTED build product (see .gitignore and
# .gitattributes). The `data` job proves it still comes out of the committed
# builder. That proof depends on the numeric stack for two separate reasons,
# and the second one cost us a red build:
#
# 1. SCIPY VERSION. The power-law fits in public/data/scaling.json come from the
#    authors' vendored scipy.optimize curve_fit / minimize. Those optimizers
#    stop at a tolerance, not at the exact optimum, so the trailing bits of
#    `amplitude` and `exponent` depend on the LAPACK/BLAS build behind the
#    scipy wheel. MEASURED: with numpy==2.4.6 pinned, scipy 1.15.3 / 1.16.3 /
#    1.17.0 each reproduce the committed bundle byte-for-byte, while scipy
#    1.18.1 moves 116 leaves by up to ~1.4e27 on values around 1e21 -- a
#    relative delta of ~1.4e-6, which straddles the comparison tolerance below.
#    So the scipy pin is not cosmetic; a bump makes this job flaky at best.
#
# 2. CPU MICROARCHITECTURE. Pinning versions cannot fix this one. scipy's
#    manylinux wheels bundle OpenBLAS, which picks a kernel at RUNTIME from the
#    CPU's feature set, so two machines running identical wheels sum in
#    different orders. The bundle was generated on a Sapphire Rapids Xeon
#    (AVX-512); the ubuntu-24.04 runner has a different one, and the first CI
#    run failed on exactly that: same builder, same pins, a handful of fitted
#    amplitudes differing in the last few bits. Bit-identical output across two
#    CPUs is a property of two identical CPUs, not of a correct build.
#
# So the job does NOT demand byte equality. tools/diff_bundle.py compares the
# rebuilt bundle to the committed one field by field and requires what is
# actually portable: identical key sets, identical array lengths, and EXACTLY
# equal strings and labels; only numeric leaves get a relative tolerance (1e-6
# -- four orders of magnitude above observed CPU noise, far below any real
# regression). It prints the worst delta on every run so the margin stays
# visible instead of becoming a mystery.
#
# It also caps its own output. The bundle is written as single-line JSON --
# scaling.json is ~6.2 MB on ONE line -- so a plain `git diff` turns a single
# changed byte into a multi-megabyte log line, which is what made the first
# failure unreadable. diff_bundle.py prints at most 12 findings as short
# path/value lines instead.
#
# Node is pinned to 24 (LTS) so the build cannot drift because a runner image
# moved.
#
# HONEST STATUS: the node job is confirmed green on a real runner. The data job
# has run on a real runner exactly once and failed on point 2 above; the
# tolerance-based gate has NOT yet been through a runner and must be confirmed
# by the next push.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Superseded PR runs are cancelled: a new push to the same ref makes every
# in-flight run for that ref redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Typecheck, test, lint, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  data:
    name: Verify data bundle and its reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Not required for correctness -- diff_bundle.py is tolerance-based on
      # purpose -- but single-threaded BLAS removes one more source of run-to-
      # run variation and costs nothing here.
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned exactly: no ranges, no constraints file. See the header --
      # these pins are load-bearing, and the compare step below is the check
      # that they are right.
      - name: Install numeric stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.4.6" "scipy==1.17.0"

      - name: Show resolved numeric stack
        run: python -c "import numpy, scipy, sys; print(sys.version.split()[0], '| numpy', numpy.__version__, '| scipy', scipy.__version__)"

      - name: Verify committed bundle (165 assertions)
        run: python tools/verify_data.py

      - name: Rebuild bundle
        run: python tools/build_data.py

      # The committed bundle must still come out of the committed builder: no
      # structural change, no changed string or label, no numeric drift beyond
      # 1e-6 relative. Replaces `git diff --exit-code`, which was unusable on
      # a single-line 6 MB JSON file -- see the header.
      - name: Compare rebuilt bundle against the committed one
        run: python tools/diff_bundle.py
